packages:
  - packages/*

minimumReleaseAge: 0
trustLockfile: true
confirmModulesPurge: false
allowBuilds:
  '@openuidev/lang-core': true
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: false
  esbuild: true
  # Fern-generated SDK tests (packages/trueforge-sdk) run msw's postinstall.
  msw: true
  protobufjs: true

# One Context module for assistant-ui (avoids "requires an AuiProvider").
overrides:
  '@assistant-ui/store': '0.2.21'
  '@assistant-ui/core': '0.2.22'
  '@assistant-ui/react': '0.14.27'
  '@assistant-ui/tap': '0.9.5'
  zustand: '^5.0.14'
  # resolve@1.22.12 ships accidental .claude/ files that break installs under macOS sandbox.
  resolve: '1.22.11'
  # Rollup 4.63.0 OOMs the frontend Vite build (Monaco + compression plugin); stay on 4.62.x.
  rollup: '4.62.2'
  dompurify: '3.4.17'
  shell-quote: '1.11.0'
  '@modelcontextprotocol/sdk@>=1.3.0 <1.32.0': '1.32.2'
  'body-parser@>=2.0.0 <2.4.0': '2.4.0'
  'follow-redirects@>=1.16.0 <=1.16.1': '1.16.3'
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'js-yaml@>=4.0.0 <4.3.2': '4.3.2'
  'launch-editor@<=2.14.1': '2.14.2'
  'node-forge@<=1.4.0': '1.4.3'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'undici@>=7.0.0 <7.30.1': '7.30.1'
  'vite@>=6.0.0 <=6.4.3': '6.4.6'
  'zod@>=4.0.0 <4.6.6': '4.6.7'
  # The patches below keep these legacy callers on the supported Zod v3 API.
  '@ag-ui/core@0.0.53>zod': '4.6.7'
  '@anthropic-ai/sandbox-runtime@0.0.77>zod': '4.6.7'

patchedDependencies:
  '@ag-ui/core@0.0.53': patches/@ag-ui+core@0.0.53-zod-v3.patch
  '@anthropic-ai/sandbox-runtime@0.0.77': patches/@anthropic-ai+sandbox-runtime@0.0.77-zod-v3.patch
  monaco-editor@0.57.0: patches/monaco-editor@0.57.0.patch
  zod@4.6.7: patches/zod-4.6.7-legacy-collection-bounds.patch
